<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 성장 트래커 - 온보딩</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: linear-gradient(180deg, #0984E3 0%, #74B9FF 50%, #E8F4FD 100%);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }

  .headline {
    margin-top: 120px; text-align: center; color: #fff;
  }
  .headline h1 {
    font-size: 72px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .headline p {
    font-size: 38px; font-weight: 400;
    margin-top: 20px; opacity: 0.9;
  }

  .phone-frame {
    margin-top: 80px;
    width: 920px; height: 1920px;
    background: #0f0f23;
    border-radius: 80px; border: 12px solid #1e1e3a;
    box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 280px; height: 55px;
    background: #0f0f23;
    border-radius: 0 0 30px 30px; z-index: 10;
  }

  .app-screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0f1a3c 0%, #0f0f23 100%);
    padding: 90px 40px 40px;
    display: flex; flex-direction: column; align-items: center;
  }

  .status-bar {
    width: 100%;
    display: flex; justify-content: space-between;
    padding: 0 10px 40px;
    color: rgba(255,255,255,0.7);
    font-size: 28px; font-weight: 600;
  }

  /* 온보딩 일러스트 */
  .onboard-illustration {
    margin: 20px 0 40px;
    text-align: center;
  }
  .onboard-illustration .big-icon { font-size: 160px; margin-bottom: 16px; }
  .onboard-illustration .sub-icons { font-size: 60px; letter-spacing: 20px; }

  /* 환영 메시지 */
  .welcome {
    text-align: center;
    margin-bottom: 50px;
  }
  .welcome h2 {
    color: #fff; font-size: 52px; font-weight: 800;
    line-height: 1.4; margin-bottom: 16px;
  }
  .welcome p {
    color: rgba(255,255,255,0.6); font-size: 30px;
    line-height: 1.6;
  }

  /* 아이 정보 입력 */
  .form-section {
    width: 100%;
    display: flex; flex-direction: column; gap: 24px;
    margin-bottom: 40px;
  }
  .form-label {
    color: rgba(255,255,255,0.5);
    font-size: 24px; font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .form-field {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 28px 32px;
    color: #fff; font-size: 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .form-field .placeholder { color: rgba(255,255,255,0.3); }
  .form-field .value { color: #74B9FF; font-weight: 600; }
  .form-field .arrow { color: rgba(255,255,255,0.3); font-size: 28px; }

  /* 관심 분야 태그 */
  .interest-tags {
    width: 100%;
    display: flex; flex-wrap: wrap; gap: 16px;
    margin-bottom: auto;
  }
  .tag {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 60px;
    padding: 18px 32px;
    color: rgba(255,255,255,0.6);
    font-size: 28px; font-weight: 500;
  }
  .tag.selected {
    background: rgba(9,132,227,0.2);
    border-color: #0984E3;
    color: #74B9FF;
  }

  /* 진행 인디케이터 */
  .progress-dots {
    display: flex; gap: 12px;
    margin: 40px 0 30px;
  }
  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .dot.active { background: #0984E3; width: 40px; border-radius: 7px; }

  /* 시작 버튼 */
  .start-btn {
    width: 100%;
    background: linear-gradient(135deg, #0984E3, #74B9FF);
    border: none; border-radius: 28px;
    padding: 36px;
    color: #fff; font-size: 36px; font-weight: 800;
    text-align: center;
    box-shadow: 0 8px 30px rgba(9,132,227,0.4);
  }
</style>
</head>
<body>
  <div class="headline">
    <h1>AI가 우리 아이<br>성장을 함께해요 🤖</h1>
    <p>맞춤형 성장 분석, 3분이면 시작!</p>
  </div>

  <div class="phone-frame">
    <div class="app-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● WiFi 🔋</span>
      </div>

      <div class="onboard-illustration">
        <div class="big-icon">🤖</div>
        <div class="sub-icons">📊 🧒 🎯</div>
      </div>

      <div class="welcome">
        <h2>아이의 성장 여정,<br>AI와 함께 시작해요</h2>
        <p>간단한 정보만 알려주시면<br>맞춤 성장 리포트를 만들어 드려요</p>
      </div>

      <div class="form-section">
        <div class="form-label">아이 정보</div>
        <div class="form-field">
          <span class="value">유나</span>
          <span class="arrow">›</span>
        </div>
        <div class="form-field">
          <span class="value">6세 (2020년생)</span>
          <span class="arrow">›</span>
        </div>
      </div>

      <div class="form-label" style="width:100%; margin-bottom:16px;">관심 분야 선택</div>
      <div class="interest-tags">
        <div class="tag selected">🎨 그리기</div>
        <div class="tag selected">📚 독서</div>
        <div class="tag">🎵 음악</div>
        <div class="tag selected">🔢 수학</div>
        <div class="tag">⚽ 운동</div>
        <div class="tag">🧪 과학</div>
        <div class="tag">🌍 영어</div>
        <div class="tag selected">🧩 퍼즐</div>
      </div>

      <div class="progress-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>

      <div class="start-btn">🚀 AI 성장 분석 시작하기</div>
    </div>
  </div>
</body>
</html>
