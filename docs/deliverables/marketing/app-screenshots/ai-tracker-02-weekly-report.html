<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 성장 트래커 - 주간 리포트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: linear-gradient(180deg, #6C5CE7 0%, #A29BFE 50%, #E8E0FF 100%);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }

  .headline {
    margin-top: 120px; text-align: center; color: #fff;
  }
  .headline h1 {
    font-size: 72px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .headline p {
    font-size: 38px; font-weight: 400;
    margin-top: 20px; opacity: 0.9;
  }

  .phone-frame {
    margin-top: 80px;
    width: 920px; height: 1920px;
    background: #0f0f23;
    border-radius: 80px; border: 12px solid #1e1e3a;
    box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 280px; height: 55px;
    background: #0f0f23;
    border-radius: 0 0 30px 30px; z-index: 10;
  }

  .app-screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #0f1a3c 0%, #0f0f23 100%);
    padding: 90px 40px 40px;
    display: flex; flex-direction: column;
  }

  .status-bar {
    display: flex; justify-content: space-between;
    padding: 0 10px 20px;
    color: rgba(255,255,255,0.7);
    font-size: 28px; font-weight: 600;
  }

  .report-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 30px;
  }
  .report-header .title {
    color: #fff; font-size: 40px; font-weight: 800;
  }
  .report-header .period {
    color: rgba(255,255,255,0.4); font-size: 24px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px; padding: 10px 20px;
  }

  /* 성장 스코어 */
  .growth-score {
    background: linear-gradient(135deg, rgba(108,92,231,0.3), rgba(162,155,254,0.15));
    border-radius: 32px;
    padding: 40px;
    display: flex; align-items: center; gap: 36px;
    margin-bottom: 28px;
    border: 1px solid rgba(108,92,231,0.3);
  }
  .score-circle {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 10px solid #6C5CE7;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; flex-shrink: 0;
    position: relative;
    background: conic-gradient(#6C5CE7 0deg 302deg, rgba(255,255,255,0.08) 302deg 360deg);
  }
  .score-circle::after {
    content: '';
    position: absolute;
    width: 112px; height: 112px;
    border-radius: 50%;
    background: #0f1a3c;
  }
  .score-num {
    color: #fff; font-size: 48px; font-weight: 800;
    position: relative; z-index: 1;
  }
  .score-label {
    color: rgba(255,255,255,0.5); font-size: 20px;
    position: relative; z-index: 1;
  }
  .score-info { flex: 1; }
  .score-info .main {
    color: #fff; font-size: 32px; font-weight: 700;
    margin-bottom: 8px;
  }
  .score-info .sub {
    color: rgba(255,255,255,0.5); font-size: 24px;
    line-height: 1.5;
  }
  .score-info .trend {
    color: #00b894; font-size: 26px; font-weight: 700;
    margin-top: 8px;
  }

  /* 주간 차트 */
  .weekly-chart {
    background: rgba(255,255,255,0.04);
    border-radius: 28px;
    padding: 32px;
    margin-bottom: 28px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .chart-title {
    color: rgba(255,255,255,0.5);
    font-size: 22px; font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }
  .chart-bars {
    display: flex; justify-content: space-between;
    align-items: flex-end;
    height: 200px; gap: 12px;
  }
  .bar-group { 
    flex: 1; display: flex; flex-direction: column; 
    align-items: center; gap: 10px; height: 100%;
    justify-content: flex-end;
  }
  .bar {
    width: 100%;
    border-radius: 10px 10px 4px 4px;
    min-height: 20px;
  }
  .bar.learning { background: linear-gradient(180deg, #6C5CE7, #a29bfe); }
  .bar.habit { background: linear-gradient(180deg, #00b894, #55E6C1); }
  .bar-label {
    color: rgba(255,255,255,0.4); font-size: 22px;
    text-align: center;
  }
  .chart-legend {
    display: flex; gap: 30px;
    margin-top: 20px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    color: rgba(255,255,255,0.5); font-size: 22px;
  }
  .legend-dot {
    width: 16px; height: 16px; border-radius: 4px;
  }

  /* 영역별 분석 */
  .areas { 
    display: flex; flex-direction: column; gap: 16px;
    margin-bottom: auto;
  }
  .area-item {
    display: flex; align-items: center; gap: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 20px;
    padding: 24px 28px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .area-icon { font-size: 40px; flex-shrink: 0; }
  .area-info { flex: 1; }
  .area-name { color: #fff; font-size: 28px; font-weight: 600; }
  .area-bar-bg {
    width: 100%; height: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px; margin-top: 10px;
    overflow: hidden;
  }
  .area-bar-fill {
    height: 100%; border-radius: 6px;
  }
  .area-pct {
    color: rgba(255,255,255,0.5);
    font-size: 26px; font-weight: 700;
    flex-shrink: 0;
  }

  /* 탭바 */
  .tab-bar {
    display: flex; justify-content: space-around;
    padding: 30px 0 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 20px;
  }
  .tab-item { text-align: center; color: rgba(255,255,255,0.35); }
  .tab-item.active { color: #6C5CE7; }
  .tab-item .tab-icon { font-size: 36px; margin-bottom: 6px; }
  .tab-item .tab-label { font-size: 22px; }
</style>
</head>
<body>
  <div class="headline">
    <h1>한 주의 성장을<br>한눈에 확인해요 📊</h1>
    <p>AI가 분석한 우리 아이 성장 리포트</p>
  </div>

  <div class="phone-frame">
    <div class="app-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● WiFi 🔋</span>
      </div>

      <div class="report-header">
        <div class="title">📊 주간 리포트</div>
        <div class="period">1월 27일 ~ 2월 2일</div>
      </div>

      <!-- 성장 스코어 -->
      <div class="growth-score">
        <div class="score-circle">
          <div class="score-num">84</div>
          <div class="score-label">점</div>
        </div>
        <div class="score-info">
          <div class="main">유나의 성장 점수</div>
          <div class="sub">이번 주 미션 달성률 87%</div>
          <div class="trend">▲ 12점 상승 (지난주 대비)</div>
        </div>
      </div>

      <!-- 주간 차트 -->
      <div class="weekly-chart">
        <div class="chart-title">일별 활동 현황</div>
        <div class="chart-bars">
          <div class="bar-group">
            <div class="bar learning" style="height:60%"></div>
            <div class="bar-label">월</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:80%"></div>
            <div class="bar-label">화</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:45%"></div>
            <div class="bar-label">수</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:90%"></div>
            <div class="bar-label">목</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:70%"></div>
            <div class="bar-label">금</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:95%"></div>
            <div class="bar-label">토</div>
          </div>
          <div class="bar-group">
            <div class="bar learning" style="height:55%"></div>
            <div class="bar-label">일</div>
          </div>
        </div>
        <div class="chart-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:#6C5CE7"></div>
            학습 활동
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#00b894"></div>
            습관 달성
          </div>
        </div>
      </div>

      <!-- 영역별 분석 -->
      <div class="areas">
        <div class="area-item">
          <div class="area-icon">📚</div>
          <div class="area-info">
            <div class="area-name">독서</div>
            <div class="area-bar-bg">
              <div class="area-bar-fill" style="width:92%; background:linear-gradient(90deg,#6C5CE7,#a29bfe)"></div>
            </div>
          </div>
          <div class="area-pct" style="color:#a29bfe">92%</div>
        </div>
        <div class="area-item">
          <div class="area-icon">🔢</div>
          <div class="area-info">
            <div class="area-name">수학</div>
            <div class="area-bar-bg">
              <div class="area-bar-fill" style="width:78%; background:linear-gradient(90deg,#0984E3,#74B9FF)"></div>
            </div>
          </div>
          <div class="area-pct" style="color:#74B9FF">78%</div>
        </div>
        <div class="area-item">
          <div class="area-icon">🎨</div>
          <div class="area-info">
            <div class="area-name">창의력</div>
            <div class="area-bar-bg">
              <div class="area-bar-fill" style="width:85%; background:linear-gradient(90deg,#FDCB6E,#F9CA24)"></div>
            </div>
          </div>
          <div class="area-pct" style="color:#FDCB6E">85%</div>
        </div>
        <div class="area-item">
          <div class="area-icon">🧩</div>
          <div class="area-info">
            <div class="area-name">문제해결</div>
            <div class="area-bar-bg">
              <div class="area-bar-fill" style="width:70%; background:linear-gradient(90deg,#00b894,#55E6C1)"></div>
            </div>
          </div>
          <div class="area-pct" style="color:#55E6C1">70%</div>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab-item">
          <div class="tab-icon">🏠</div>
          <div class="tab-label">홈</div>
        </div>
        <div class="tab-item active">
          <div class="tab-icon">📊</div>
          <div class="tab-label">리포트</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">🤖</div>
          <div class="tab-label">AI 추천</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">⚙️</div>
          <div class="tab-label">설정</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
