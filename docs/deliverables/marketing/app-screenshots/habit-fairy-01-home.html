<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>습관요정 - 홈 화면</title>
<style>
  /* 앱스토어 스크린샷: 1290×2796 (iPhone 15 Pro Max 기준) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: linear-gradient(180deg, #6C5CE7 0%, #A29BFE 50%, #DFE6E9 100%);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }

  /* 상단 카피 */
  .headline {
    margin-top: 120px;
    text-align: center;
    color: #fff;
  }
  .headline h1 {
    font-size: 72px; font-weight: 800;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .headline p {
    font-size: 38px; font-weight: 400;
    margin-top: 20px; opacity: 0.9;
  }

  /* 폰 프레임 */
  .phone-frame {
    margin-top: 80px;
    width: 920px; height: 1920px;
    background: #1a1a2e;
    border-radius: 80px;
    border: 12px solid #2d2d44;
    box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden;
    position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 280px; height: 55px;
    background: #1a1a2e;
    border-radius: 0 0 30px 30px;
    z-index: 10;
  }

  /* 앱 화면 내부 */
  .app-screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #2D1B69 0%, #1a1a2e 100%);
    padding: 90px 40px 40px;
    display: flex; flex-direction: column;
  }

  /* 상태바 */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 10px 30px;
    color: rgba(255,255,255,0.7);
    font-size: 28px; font-weight: 600;
  }

  /* 인사말 */
  .greeting {
    color: #fff;
    margin-bottom: 40px;
  }
  .greeting .name { font-size: 48px; font-weight: 700; }
  .greeting .sub { font-size: 30px; color: rgba(255,255,255,0.6); margin-top: 8px; }

  /* 요정 캐릭터 영역 */
  .fairy-area {
    background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%);
    border-radius: 40px;
    padding: 50px;
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }
  .fairy-area::after {
    content: ''; position: absolute;
    top: -30px; right: -30px;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .fairy-emoji { font-size: 120px; margin-bottom: 20px; }
  .fairy-msg {
    color: #fff; font-size: 34px; font-weight: 600;
    line-height: 1.5;
  }
  .fairy-sub {
    color: rgba(255,255,255,0.7); font-size: 26px;
    margin-top: 10px;
  }

  /* 오늘의 미션 리스트 */
  .section-title {
    color: rgba(255,255,255,0.5);
    font-size: 26px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }
  .mission-list { display: flex; flex-direction: column; gap: 20px; }
  .mission-item {
    background: rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 32px 36px;
    display: flex; align-items: center; gap: 28px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .mission-icon {
    width: 72px; height: 72px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    flex-shrink: 0;
  }
  .mission-icon.orange { background: rgba(253,203,110,0.2); }
  .mission-icon.blue { background: rgba(116,185,255,0.2); }
  .mission-icon.green { background: rgba(85,239,196,0.2); }
  .mission-icon.pink { background: rgba(253,121,168,0.2); }
  .mission-info { flex: 1; }
  .mission-name { color: #fff; font-size: 32px; font-weight: 600; }
  .mission-time { color: rgba(255,255,255,0.4); font-size: 24px; margin-top: 6px; }
  .mission-check {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .mission-check.done {
    background: #00b894;
    border-color: #00b894;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 28px; font-weight: 700;
  }

  /* 하단 탭바 */
  .tab-bar {
    margin-top: auto;
    display: flex; justify-content: space-around;
    padding: 30px 0 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .tab-item { text-align: center; color: rgba(255,255,255,0.35); }
  .tab-item.active { color: #6C5CE7; }
  .tab-item .tab-icon { font-size: 36px; margin-bottom: 6px; }
  .tab-item .tab-label { font-size: 22px; }
</style>
</head>
<body>
  <!-- 상단 마케팅 카피 -->
  <div class="headline">
    <h1>우리 아이 습관,<br>요정이 도와줘요!</h1>
    <p>매일 작은 미션으로 큰 성장을 만들어요</p>
  </div>

  <!-- 폰 프레임 -->
  <div class="phone-frame">
    <div class="app-screen">
      <!-- 상태바 -->
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● WiFi 🔋</span>
      </div>

      <!-- 인사말 -->
      <div class="greeting">
        <div class="name">안녕, 유나! 🌟</div>
        <div class="sub">오늘도 멋진 하루를 시작해볼까?</div>
      </div>

      <!-- 요정 캐릭터 -->
      <div class="fairy-area">
        <div class="fairy-emoji">🧚‍♀️</div>
        <div class="fairy-msg">반짝이가 응원하고 있어!</div>
        <div class="fairy-sub">오늘 미션 4개 중 1개 완료 ⭐</div>
      </div>

      <!-- 오늘의 미션 -->
      <div class="section-title">오늘의 미션</div>
      <div class="mission-list">
        <div class="mission-item">
          <div class="mission-icon orange">🦷</div>
          <div class="mission-info">
            <div class="mission-name">양치하기</div>
            <div class="mission-time">아침 · 완료!</div>
          </div>
          <div class="mission-check done">✓</div>
        </div>
        <div class="mission-item">
          <div class="mission-icon blue">📚</div>
          <div class="mission-info">
            <div class="mission-name">책 읽기 10분</div>
            <div class="mission-time">오후 · 진행 전</div>
          </div>
          <div class="mission-check"></div>
        </div>
        <div class="mission-item">
          <div class="mission-icon green">🧹</div>
          <div class="mission-info">
            <div class="mission-name">장난감 정리</div>
            <div class="mission-time">저녁 · 진행 전</div>
          </div>
          <div class="mission-check"></div>
        </div>
        <div class="mission-item">
          <div class="mission-icon pink">🌙</div>
          <div class="mission-info">
            <div class="mission-name">일찍 잠자기</div>
            <div class="mission-time">밤 9시 · 진행 전</div>
          </div>
          <div class="mission-check"></div>
        </div>
      </div>

      <!-- 하단 탭바 -->
      <div class="tab-bar">
        <div class="tab-item active">
          <div class="tab-icon">🏠</div>
          <div class="tab-label">홈</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">🎯</div>
          <div class="tab-label">미션</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">⭐</div>
          <div class="tab-label">보상</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">👤</div>
          <div class="tab-label">내 정보</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
