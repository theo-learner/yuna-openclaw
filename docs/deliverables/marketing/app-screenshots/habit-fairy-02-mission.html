<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>습관요정 - 미션 실행 화면</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: linear-gradient(180deg, #00B894 0%, #55E6C1 50%, #DFE6E9 100%);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }

  .headline {
    margin-top: 120px;
    text-align: center; color: #fff;
  }
  .headline h1 {
    font-size: 72px; font-weight: 800;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .headline p {
    font-size: 38px; font-weight: 400;
    margin-top: 20px; opacity: 0.9;
  }

  .phone-frame {
    margin-top: 80px;
    width: 920px; height: 1920px;
    background: #1a1a2e;
    border-radius: 80px;
    border: 12px solid #2d2d44;
    box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 280px; height: 55px;
    background: #1a1a2e;
    border-radius: 0 0 30px 30px; z-index: 10;
  }

  .app-screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #1B4332 0%, #1a1a2e 100%);
    padding: 90px 40px 40px;
    display: flex; flex-direction: column; align-items: center;
  }

  .status-bar {
    width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 10px 30px;
    color: rgba(255,255,255,0.7);
    font-size: 28px; font-weight: 600;
  }

  .back-nav {
    width: 100%;
    display: flex; align-items: center; gap: 16px;
    color: rgba(255,255,255,0.6);
    font-size: 30px; margin-bottom: 40px;
  }

  /* 미션 진행 카드 */
  .mission-card {
    width: 100%;
    background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
    border-radius: 40px;
    padding: 60px 50px;
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    overflow: hidden;
  }
  .mission-card::before {
    content: '';
    position: absolute; bottom: -40px; left: -40px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .mission-card::after {
    content: '';
    position: absolute; top: -20px; right: -20px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .mission-card .icon { font-size: 100px; margin-bottom: 24px; }
  .mission-card .title {
    color: #fff; font-size: 44px; font-weight: 800;
  }
  .mission-card .desc {
    color: rgba(255,255,255,0.8); font-size: 28px;
    margin-top: 12px;
  }

  /* 타이머 */
  .timer-area {
    margin: 30px 0;
    text-align: center;
  }
  .timer-ring {
    width: 320px; height: 320px;
    border-radius: 50%;
    border: 16px solid rgba(255,255,255,0.08);
    border-top-color: #00b894;
    border-right-color: #00b894;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    margin: 0 auto 20px;
    position: relative;
    animation: none;
  }
  .timer-ring::before {
    content: '';
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: rgba(0,184,148,0.05);
  }
  .timer-num {
    color: #fff; font-size: 80px; font-weight: 800;
    position: relative; z-index: 1;
  }
  .timer-label {
    color: rgba(255,255,255,0.5); font-size: 26px;
    position: relative; z-index: 1;
  }

  /* 요정 응원 */
  .fairy-cheer {
    background: rgba(255,255,255,0.06);
    border-radius: 28px;
    padding: 32px 40px;
    display: flex; align-items: center; gap: 24px;
    width: 100%;
    margin-bottom: 40px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .fairy-cheer .emoji { font-size: 60px; flex-shrink: 0; }
  .fairy-cheer .text {
    color: rgba(255,255,255,0.8); font-size: 28px;
    line-height: 1.5;
  }

  /* 진행 단계 */
  .steps {
    width: 100%;
    display: flex; flex-direction: column; gap: 20px;
    margin-bottom: auto;
  }
  .step {
    display: flex; align-items: center; gap: 20px;
    padding: 24px 30px;
    border-radius: 20px;
  }
  .step-num {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
    flex-shrink: 0;
  }
  .step.done .step-num { background: #00b894; color: #fff; }
  .step.active .step-num { background: rgba(0,184,148,0.3); color: #00b894; border: 3px solid #00b894; }
  .step.pending .step-num { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); }
  .step-text { color: rgba(255,255,255,0.7); font-size: 28px; }
  .step.done .step-text { color: rgba(255,255,255,0.4); text-decoration: line-through; }
  .step.active .step-text { color: #fff; font-weight: 600; }

  /* 완료 버튼 */
  .action-btn {
    width: 100%;
    background: linear-gradient(135deg, #00b894, #00cec9);
    border: none; border-radius: 28px;
    padding: 36px;
    color: #fff; font-size: 36px; font-weight: 800;
    text-align: center;
    margin-top: 30px;
    box-shadow: 0 8px 30px rgba(0,184,148,0.4);
  }
</style>
</head>
<body>
  <div class="headline">
    <h1>미션을 수행하면<br>별이 쏟아져요! ⭐</h1>
    <p>재미있는 미션으로 습관을 만들어요</p>
  </div>

  <div class="phone-frame">
    <div class="app-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● WiFi 🔋</span>
      </div>

      <div class="back-nav">← 미션 실행</div>

      <!-- 미션 카드 -->
      <div class="mission-card">
        <div class="icon">📚</div>
        <div class="title">책 읽기 10분</div>
        <div class="desc">좋아하는 책을 골라서 읽어보자!</div>
      </div>

      <!-- 타이머 -->
      <div class="timer-area">
        <div class="timer-ring">
          <div class="timer-num">7:23</div>
          <div class="timer-label">남은 시간</div>
        </div>
      </div>

      <!-- 요정 응원 -->
      <div class="fairy-cheer">
        <div class="emoji">🧚‍♀️</div>
        <div class="text">반짝이: "벌써 절반이나 왔어!<br>조금만 더 힘내자~ 💪"</div>
      </div>

      <!-- 진행 단계 -->
      <div class="steps">
        <div class="step done">
          <div class="step-num">✓</div>
          <div class="step-text">책 고르기</div>
        </div>
        <div class="step active">
          <div class="step-num">2</div>
          <div class="step-text">10분 동안 읽기</div>
        </div>
        <div class="step pending">
          <div class="step-num">3</div>
          <div class="step-text">느낀 점 한마디</div>
        </div>
      </div>

      <!-- 완료 버튼 -->
      <div class="action-btn">📖 다 읽었어요!</div>
    </div>
  </div>
</body>
</html>
