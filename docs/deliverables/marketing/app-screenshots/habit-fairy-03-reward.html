<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>습관요정 - 별 보상 화면</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px; height: 2796px;
    background: linear-gradient(180deg, #FDCB6E 0%, #F9CA24 50%, #FFF3E0 100%);
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }

  .headline {
    margin-top: 120px; text-align: center; color: #fff;
  }
  .headline h1 {
    font-size: 72px; font-weight: 800; line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
    color: #5D4E37;
  }
  .headline p {
    font-size: 38px; font-weight: 400;
    margin-top: 20px; color: rgba(93,78,55,0.7);
  }

  .phone-frame {
    margin-top: 80px;
    width: 920px; height: 1920px;
    background: #1a1a2e;
    border-radius: 80px; border: 12px solid #2d2d44;
    box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.1);
    overflow: hidden; position: relative;
  }
  .phone-frame::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 280px; height: 55px;
    background: #1a1a2e;
    border-radius: 0 0 30px 30px; z-index: 10;
  }

  .app-screen {
    width: 100%; height: 100%;
    background: linear-gradient(180deg, #2D1B69 0%, #1a1a2e 100%);
    padding: 90px 40px 40px;
    display: flex; flex-direction: column; align-items: center;
  }

  .status-bar {
    width: 100%;
    display: flex; justify-content: space-between;
    padding: 0 10px 30px;
    color: rgba(255,255,255,0.7);
    font-size: 28px; font-weight: 600;
  }

  /* 별 카운터 */
  .star-counter {
    display: flex; align-items: center; gap: 16px;
    background: rgba(253,203,110,0.15);
    border: 2px solid rgba(253,203,110,0.3);
    border-radius: 60px;
    padding: 20px 40px;
    margin-bottom: 40px;
  }
  .star-counter .icon { font-size: 44px; }
  .star-counter .count {
    color: #FDCB6E; font-size: 44px; font-weight: 800;
  }
  .star-counter .label {
    color: rgba(255,255,255,0.5); font-size: 26px;
  }

  /* 축하 영역 */
  .celebration {
    text-align: center;
    margin-bottom: 40px;
    padding: 50px 0;
  }
  .celebration .sparkles { font-size: 80px; margin-bottom: 10px; }
  .celebration .big-star { font-size: 140px; margin-bottom: 20px; }
  .celebration .msg {
    color: #FDCB6E; font-size: 44px; font-weight: 800;
  }
  .celebration .sub {
    color: rgba(255,255,255,0.6); font-size: 28px;
    margin-top: 12px;
  }
  .celebration .earned {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(253,203,110,0.2);
    border-radius: 20px; padding: 16px 36px;
    color: #FDCB6E; font-size: 36px; font-weight: 700;
    margin-top: 24px;
  }

  /* 보상 상점 */
  .section-title {
    width: 100%;
    color: rgba(255,255,255,0.5);
    font-size: 26px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }
  .rewards-grid {
    width: 100%;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 20px; margin-bottom: auto;
  }
  .reward-card {
    background: rgba(255,255,255,0.06);
    border-radius: 28px;
    padding: 36px 24px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.2s;
  }
  .reward-card .r-icon { font-size: 64px; margin-bottom: 16px; }
  .reward-card .r-name {
    color: #fff; font-size: 28px; font-weight: 600;
    margin-bottom: 8px;
  }
  .reward-card .r-cost {
    color: #FDCB6E; font-size: 24px; font-weight: 700;
  }
  .reward-card.affordable {
    border-color: rgba(253,203,110,0.3);
    background: rgba(253,203,110,0.08);
  }

  /* 탭바 */
  .tab-bar {
    width: 100%; margin-top: 30px;
    display: flex; justify-content: space-around;
    padding: 30px 0 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .tab-item { text-align: center; color: rgba(255,255,255,0.35); }
  .tab-item.active { color: #FDCB6E; }
  .tab-item .tab-icon { font-size: 36px; margin-bottom: 6px; }
  .tab-item .tab-label { font-size: 22px; }
</style>
</head>
<body>
  <div class="headline">
    <h1>모은 별로<br>특별한 보상을! 🎁</h1>
    <p>습관을 지키면 별이 차곡차곡</p>
  </div>

  <div class="phone-frame">
    <div class="app-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●● WiFi 🔋</span>
      </div>

      <!-- 별 카운터 -->
      <div class="star-counter">
        <div class="icon">⭐</div>
        <div class="count">47</div>
        <div class="label">개의 별</div>
      </div>

      <!-- 축하 -->
      <div class="celebration">
        <div class="sparkles">✨🎉✨</div>
        <div class="big-star">🌟</div>
        <div class="msg">미션 완료! 대단해!</div>
        <div class="sub">책 읽기 10분을 완수했어요</div>
        <div class="earned">⭐ +5 별 획득!</div>
      </div>

      <!-- 보상 상점 -->
      <div class="section-title">보상 상점 ✨</div>
      <div class="rewards-grid">
        <div class="reward-card affordable">
          <div class="r-icon">🎨</div>
          <div class="r-name">색칠 놀이<br>30분</div>
          <div class="r-cost">⭐ 15</div>
        </div>
        <div class="reward-card affordable">
          <div class="r-icon">📺</div>
          <div class="r-name">만화 영화<br>1편</div>
          <div class="r-cost">⭐ 30</div>
        </div>
        <div class="reward-card">
          <div class="r-icon">🎮</div>
          <div class="r-name">게임 시간<br>30분</div>
          <div class="r-cost">⭐ 50</div>
        </div>
        <div class="reward-card">
          <div class="r-icon">🍦</div>
          <div class="r-name">아이스크림<br>고르기</div>
          <div class="r-cost">⭐ 80</div>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab-item">
          <div class="tab-icon">🏠</div>
          <div class="tab-label">홈</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">🎯</div>
          <div class="tab-label">미션</div>
        </div>
        <div class="tab-item active">
          <div class="tab-icon">⭐</div>
          <div class="tab-label">보상</div>
        </div>
        <div class="tab-item">
          <div class="tab-icon">👤</div>
          <div class="tab-label">내 정보</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
